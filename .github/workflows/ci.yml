name: CI

# Runs on every pull request, and on pushes to main so the default branch is
# never left in a state nobody checked.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json pins and fails if the
      # lockfile and package.json disagree, which npm install would paper over.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build needs no Supabase credentials: src/lib/supabase.js tolerates
      # missing environment values and the data layer falls back accordingly.
      - name: Build
        run: npm run build
